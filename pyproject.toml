[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-herramienta-de-analisis"
version = "2.0.0"
description = "Herramienta de análisis OSINT de redes (dominios, IPs, URLs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adrian A. Lanzone" }]
dependencies = [
    "PyQt6>=6.5.0",
    "requests>=2.31.0",
    "python-whois>=0.9.3",
    "dnspython>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
osint = "osint.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["src/osint/ui/osint_window_ui.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
