<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"
       font-family="'Inter','Segoe UI',sans-serif">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#2e5aa8"/>
      </marker>
    </defs>

    <!-- ============ LANE LABELS ============ -->
    <text x="14" y="55" fill="#7a8399" font-size="10" font-family="'JetBrains Mono',monospace" letter-spacing="0.14em">UI</text>
    <text x="14" y="335" fill="#7a8399" font-size="10" font-family="'JetBrains Mono',monospace" letter-spacing="0.14em">CONTROL</text>
    <text x="14" y="465" fill="#7a8399" font-size="10" font-family="'JetBrains Mono',monospace" letter-spacing="0.14em">SERVICES</text>
    <text x="14" y="590" fill="#7a8399" font-size="10" font-family="'JetBrains Mono',monospace" letter-spacing="0.14em">DATA</text>

    <!-- ============ UI LANE ============ -->
    <!-- Layout -->
    <rect x="60" y="60" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="68" y="68" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="90" y="78" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>
    <text x="140" y="103" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Layout</text>
    <text x="140" y="120" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ui/layout.py</text>

    <!-- Main Window (focal) -->
    <rect x="260" y="60" width="220" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="60" width="220" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="268" y="68" width="58" height="14" rx="2" fill="#f5f5f5" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="297" y="78" fill="#eb6c36" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WINDOW</text>
    <text x="370" y="103" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Main Window</text>
    <text x="370" y="120" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ui/main_window.py</text>

    <!-- Themes -->
    <rect x="520" y="60" width="140" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="528" y="68" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="550" y="78" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>
    <text x="590" y="103" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Themes</text>
    <text x="590" y="120" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ui/themes.py</text>

    <!-- i18n -->
    <rect x="700" y="60" width="120" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="708" y="68" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="730" y="78" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>
    <text x="760" y="103" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">i18n</text>
    <text x="760" y="120" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ui/i18n.py</text>

    <!-- Formatters (below Main Window) -->
    <rect x="300" y="180" width="160" height="70" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="308" y="188" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="330" y="198" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">UI</text>
    <text x="380" y="216" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Formatters</text>
    <text x="380" y="232" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ui/formatters.py</text>

    <!-- ============ CONTROL LANE ============ -->
    <!-- AppOSINT Controller -->
    <rect x="60" y="320" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="68" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="97" y="338" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CTRL</text>
    <text x="160" y="362" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">AppOSINT</text>
    <text x="160" y="378" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">Controller</text>

    <!-- Worker -->
    <rect x="320" y="320" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="328" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="357" y="338" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CTRL</text>
    <text x="400" y="362" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Worker</text>
    <text x="400" y="378" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">core/worker.py</text>

    <!-- Analyzer -->
    <rect x="540" y="320" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="548" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="577" y="338" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CTRL</text>
    <text x="620" y="362" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Analyzer</text>
    <text x="620" y="378" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">core/analyzer.py</text>

    <!-- ============ SERVICES LANE ============ -->
    <!-- Service Base -->
    <rect x="60" y="450" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="68" y="458" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="90" y="468" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">CORE</text>
    <text x="140" y="493" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Service Base</text>
    <text x="140" y="510" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">services/base.py</text>

    <!-- 8 OSINT Services -->
    <rect x="280" y="450" width="320" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="288" y="458" width="44" height="14" rx="2" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.35" stroke-width="0.8"/>
    <text x="310" y="468" fill="#2d3142" fill-opacity="0.7" font-size="8" font-family="'JetBrains Mono',monospace" text-anchor="middle" letter-spacing="0.06em">SVCS</text>
    <text x="440" y="488" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">8 OSINT Services</text>
    <text x="440" y="506" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">geo · whois · ping · dns · ssl · headers · port · reverse</text>

    <!-- External APIs -->
    <rect x="660" y="450" width="180" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="750" y="488" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">External APIs</text>
    <text x="750" y="506" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">ip-api · whois · dns · requests</text>

    <!-- ============ DATA LANE ============ -->
    <!-- History -->
    <rect x="60" y="580" width="160" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="140" y="603" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">History</text>
    <text x="140" y="618" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">models/history.py</text>

    <!-- Exporter -->
    <rect x="320" y="580" width="160" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="400" y="603" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Exporter</text>
    <text x="400" y="618" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">exporters/export.py</text>

    <!-- IconManager -->
    <rect x="540" y="580" width="160" height="50" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="620" y="603" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">IconManager</text>
    <text x="620" y="618" fill="#4f5d75" font-size="9" font-family="'JetBrains Mono',monospace" text-anchor="middle">config.py</text>

    <!-- ============ CONNECTIONS ============ -->
    <!-- UI internal flow -->
    <path d="M220,100 H256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,100 H516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M660,100 H696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Formatters -> Main Window (vertical up) -->
    <path d="M380,180 V144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Main Window -> Controller (route around Formatters: down, left at y=290, down) -->
    <path d="M260,140 V290" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M260,290 H160 V318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Control internal -->
    <path d="M260,360 H316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M480,360 H536" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Analyzer -> 8 Services (route down and left, avoids External APIs) -->
    <path d="M620,400 V420 H440 V448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Services internal -->
    <path d="M220,490 H276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M600,490 H656" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    <!-- Controller -> Data: bus at x=240 vertical, y=545 horizontal -->
    <path d="M260,360 H240 V545" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <path d="M240,545 H160 V578" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M240,545 H400 V578" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M240,545 H620 V578" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  </svg>
